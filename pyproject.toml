[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysuite"
version = "0.1.0"
description = "Cybersecurity and sysadmin toolkit for the command line"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "psutil>=5.9",
    "dnspython>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pysuite = "pysuite.cli:app"

[tool.setuptools.packages.find]
include = ["pysuite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
